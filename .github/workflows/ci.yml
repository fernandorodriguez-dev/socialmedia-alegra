name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de los módulos
        run: |
          for f in intake-chat/core/config.js intake-chat/core/flow.js intake-chat/core/linear-sync.js intake-chat/test/simulate.js; do
            node --check "$f" && echo "ok $f"
          done

      - name: Configuración del bot válida
        run: |
          node -e "
            const c = require('./intake-chat/core/config.js');
            const emails = new Set(Object.keys(c.people));
            if (!c.team || !c.team.id) throw new Error('falta team.id');
            if (!c.assigneeRules || !c.assigneeRules.length) throw new Error('faltan assigneeRules');
            if (!emails.has(c.defaultAssignee)) throw new Error('defaultAssignee no está en people');
            for (const r of c.assigneeRules) {
              if (!emails.has(r.email)) throw new Error('la regla ' + r.id + ' apunta a ' + r.email + ', que no está en people');
            }
            const faltan = ['versiones','canales','icps','loops','formatos','duraciones']
              .filter((k) => !Array.isArray(c[k]) || !c[k].length);
            if (faltan.length) throw new Error('listas vacías: ' + faltan.join(', '));
            console.log('config OK ·', c.assigneeRules.length, 'reglas ·', emails.size, 'personas');
          "

      - name: Que no haya secretos en el repo
        run: |
          if grep -rIl --exclude-dir=.git -E 'lin_api_[A-Za-z0-9]{10,}' .; then
            echo "::error::Hay una API key de Linear en el repositorio"
            exit 1
          fi
          echo "sin secretos"
